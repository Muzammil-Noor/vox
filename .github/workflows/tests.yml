name: tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    defaults:
      run:
        # Git Bash on Windows, so one set of commands covers both runners.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Java engine
        run: bash scripts/build.sh

      - name: Build the TypeScript engine
        run: npm run build -w @vox/core

      - name: Java engine
        run: VOX_REPORT="java-${{ matrix.platform }}.tsv" bash scripts/test.sh

      - name: Upload Java verdicts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: verdicts-${{ matrix.platform }}
          path: java-${{ matrix.platform }}.tsv
          if-no-files-found: ignore

      - name: TypeScript engine
        run: VOX_CMD="node engines/typescript/dist/cli.js" bash scripts/test.sh

      - name: Engine parity
        run: bash scripts/parity.sh

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # The core build generates the parser from Vox.g4, which needs Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        # web's prebuild builds core; build is `tsc --noEmit && vite build`.
        run: npm run build -w @vox/web

  publish:
    name: Publish Java results
    needs: suite
    # Publishes whatever the suite found, pass or fail, but only from main:
    # a feature branch must not overwrite what the website shows.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v8
        with:
          pattern: verdicts-*
          path: verdicts
          merge-multiple: true

      - name: Build the report
        id: report
        run: |
          missing=""
          for platform in linux windows; do
            [ -f "verdicts/java-$platform.tsv" ] || missing="$missing $platform"
          done
          if [ -n "$missing" ]; then
            echo "::warning::no verdicts for$missing; the suite did not get that far, so nothing is published"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/report.mjs --out latest.json \
            windows=verdicts/java-windows.tsv \
            linux=verdicts/java-linux.tsv
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Push to the test-results branch
        if: steps.report.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fresh single-commit history each time, force-pushed: the branch
          # is a pointer to the latest results, not an archive, so it never
          # grows and never needs pulling into main.
          mkdir -p publish
          cp latest.json publish/
          # Vercel watches every branch of this repo. This branch has no site
          # in it, so without the flag below Vercel keeps trying to build a
          # preview of it and failing. Written here as well as on main because
          # the docs do not say which branch's config is consulted.
          echo '{ "git": { "deploymentEnabled": false } }' > publish/vercel.json
          cd publish
          git init -q -b test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json vercel.json
          git commit -q -m "Java results for ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            test-results
          echo "published to the test-results branch"
