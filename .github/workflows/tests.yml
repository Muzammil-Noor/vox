# Runs the whole regression suite on every push: each engine against its
# expected output, the two engines against each other, and the web app's type
# check and build.
#
# The release workflow runs these same suites before it ships anything, so a
# green run here means a VERSION bump is safe to push.
name: tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an in-flight run pointless.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # A Windows-only failure should not hide the Linux result, or the reverse.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so one set of commands covers both runners.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Java engine
        run: bash build.sh

      - name: Build the TypeScript engine
        run: npm run build -w core

      - name: Java engine
        run: bash tests/run.sh

      - name: TypeScript engine
        run: VOX_CMD="node core/dist/cli.js" bash tests/run.sh

      - name: Engine parity
        run: bash tests/parity.sh

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # The core build generates the parser from Vox.g4, which needs Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        # web's prebuild builds core; build is `tsc --noEmit && vite build`.
        run: npm run build -w web
